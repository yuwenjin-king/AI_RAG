apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-worker
  namespace: enterprise-rag
  labels:
    app: ingest-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ingest-worker
  template:
    metadata:
      labels:
        app: ingest-worker
    spec:
      containers:
        - name: ingest-worker
          image: enterprise-rag/backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.ingest_worker"]
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-secret
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "3Gi"
