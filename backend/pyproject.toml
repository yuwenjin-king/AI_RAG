[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-backend"
version = "0.1.0"
description = "Enterprise-grade multi-tenant RAG platform — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    # Web / API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Vector store
    "pymilvus>=2.4.3",
    # Full-text search
    "opensearch-py>=2.5.0",
    # Cache / messaging / object storage
    "redis>=5.0.4",
    "aiokafka>=0.11.0",
    "minio>=7.2.7",
    # Parsing
    "pymupdf>=1.24.6",
    "pdfplumber>=0.11",   # 表格抽取（plan_three §4；纯 Python，轻量；未装则 tables.py 降级 NoOp）
    # HTTP / resilience
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
    # Observability
    "prometheus-client>=0.20",
    # 分布式追踪（plan_three §3；未装则 tracing.py 降级为 no-op）
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.4",
]
layout = [
    # 可选：视觉版面检测 / OCR（默认不启用，留 hook）
    "ultralytics>=8.2",
    "paddleocr>=2.7",
    "pillow>=10.0",
    # 可选：camelot 表格抽取（lattice/stream，需系统级 ghostscript；pdfplumber 已在核心依赖）
    "camelot-py>=0.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
